<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Detail Transaksi - ReflectSpend</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Design System Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#454746",
                        "on-surface-variant": "#414755",
                        "surface-variant": "#e5e2e1",
                        "surface-container-high": "#eae7e7",
                        "on-error": "#ffffff",
                        "primary-container": "#0070eb",
                        "secondary": "#5d5f5d",
                        "surface-container-highest": "#e5e2e1",
                        "on-tertiary": "#ffffff",
                        "surface": "#fcf9f8",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#fefcff",
                        "inverse-on-surface": "#f3f0ef",
                        "secondary-container": "#e2e3e1",
                        "tertiary-container": "#c64f00",
                        "background": "#fcf9f8",
                        "on-primary-fixed-variant": "#004493",
                        "on-secondary-container": "#636563",
                        "tertiary-fixed": "#ffdbcc",
                        "outline": "#717786",
                        "error": "#ba1a1a",
                        "surface-container": "#f0eded",
                        "on-tertiary-fixed": "#351000",
                        "surface-dim": "#dcd9d9",
                        "inverse-primary": "#adc6ff",
                        "on-background": "#1c1b1b",
                        "secondary-fixed": "#e2e3e1",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c1c6d7",
                        "on-secondary-fixed": "#1a1c1b",
                        "inverse-surface": "#313030",
                        "on-primary-fixed": "#001a41",
                        "primary-fixed-dim": "#adc6ff",
                        "secondary-fixed-dim": "#c6c7c5",
                        "primary": "#0058bc",
                        "tertiary-fixed-dim": "#ffb595",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "surface-container-low": "#f6f3f2",
                        "on-error-container": "#93000a",
                        "tertiary": "#9e3d00",
                        "surface-tint": "#005bc1",
                        "primary-fixed": "#d8e2ff",
                        "on-surface": "#1c1b1b",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "surface-bright": "#fcf9f8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "xs": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "gutter": "16px",
                        "sm": "8px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter", "sans-serif"],
                        "body-secondary": ["Inter", "sans-serif"],
                        "display-amount": ["Inter", "sans-serif"],
                        "section-title": ["Inter", "sans-serif"],
                        "card-title": ["Inter", "sans-serif"],
                        "metadata": ["Inter", "sans-serif"],
                        "page-title": ["Inter", "sans-serif"],
                        "body-main": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600" }],
                        "body-secondary": ["15px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-amount": ["34px", { "lineHeight": "41px", "letterSpacing": "-0.5px", "fontWeight": "700" }],
                        "section-title": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "card-title": ["17px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "metadata": ["13px", { "lineHeight": "18px", "letterSpacing": "0.1px", "fontWeight": "400" }],
                        "page-title": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.4px", "fontWeight": "600" }],
                        "body-main": ["17px", { "lineHeight": "22px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Base typography application and Material Symbol default */
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center w-full antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Task-Focused Navigation Header -->
<header class="w-full max-w-[600px] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-surface-variant">
<button class="flex items-center gap-sm text-on-surface-variant hover:text-primary transition-colors py-sm pr-sm rounded-lg active:scale-95">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span class="font-label-caps text-label-caps">Kembali</span>
</button>
<button class="flex items-center gap-sm text-on-surface-variant hover:text-primary transition-colors py-sm pl-sm rounded-lg active:scale-95">
<span class="material-symbols-outlined text-[20px]">edit</span>
<span class="font-label-caps text-label-caps">Edit</span>
</button>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-[600px] flex-1 flex flex-col pb-xl">
<!-- Hero: Transaction Summary -->
<section class="flex flex-col items-center justify-center pt-xl pb-lg px-margin-mobile animate-fade-in-up">
<div class="w-20 h-20 rounded-[20px] bg-surface-container flex items-center justify-center mb-md border border-outline-variant shadow-sm transition-transform hover:scale-105 duration-300">
<span class="material-symbols-outlined text-[40px] text-secondary" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<h1 class="font-display-amount text-display-amount text-on-background mb-xs tracking-tight">-Rp75.000</h1>
<p class="font-body-main text-body-main text-on-surface-variant">Makanan &amp; Minuman</p>
</section>
<!-- Details Bento Card -->
<section class="px-margin-mobile md:px-margin-desktop mb-lg">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col shadow-sm">
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="text-on-surface-variant font-metadata text-metadata">Tanggal</span>
<span class="text-on-background font-body-secondary text-body-secondary font-medium">10 Jan 2025</span>
</div>
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="text-on-surface-variant font-metadata text-metadata">Metode</span>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-primary">qr_code_scanner</span>
<span class="text-on-background font-body-secondary text-body-secondary font-medium">QRIS</span>
</div>
</div>
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="text-on-surface-variant font-metadata text-metadata">Emosi</span>
<div class="flex items-center gap-xs bg-error-container/30 border border-error-container px-sm py-[2px] rounded-full">
<div class="w-2 h-2 rounded-full bg-error"></div>
<span class="text-on-background font-body-secondary text-body-secondary font-medium">Stres (8)</span>
</div>
</div>
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="text-on-surface-variant font-metadata text-metadata">Direncanakan</span>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-secondary">cancel</span>
<span class="text-on-background font-body-secondary text-body-secondary font-medium">Tidak</span>
</div>
</div>
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="text-on-surface-variant font-metadata text-metadata">Pemicu</span>
<span class="text-on-background font-body-secondary text-body-secondary font-medium text-right max-w-[150px] truncate" title="Stres Kerja">Stres Kerja</span>
</div>
<div class="flex justify-between items-center pt-sm">
<span class="text-on-surface-variant font-metadata text-metadata">Akan beli lagi</span>
<span class="text-on-background font-body-secondary text-body-secondary font-medium">Tidak</span>
</div>
</div>
</section>
<!-- Journal Notes Section -->
<section class="px-margin-mobile md:px-margin-desktop mb-xl flex-1">
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-sm tracking-wider">CATATAN</h2>
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-md shadow-sm relative overflow-hidden group hover:bg-surface-container transition-colors duration-300">
<!-- Decorative subtle element indicating a note -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-surface-variant group-hover:bg-primary/20 transition-colors duration-300"></div>
<p class="font-body-main text-body-main text-on-background leading-relaxed italic pl-xs">
                    "Pulang kerja lelah, beli makanan lebih banyak dari yang dibutuhkan."
                </p>
</div>
</section>
<!-- Bottom Action: Destructive -->
<section class="px-margin-mobile md:px-margin-desktop mt-auto pt-md">
<button class="w-full h-[50px] flex items-center justify-center gap-sm rounded-lg border border-error text-error bg-surface-container-lowest hover:bg-error hover:text-on-error hover:border-error transition-all duration-200 font-body-secondary text-body-secondary font-semibold active:scale-[0.98] shadow-sm">
<span class="material-symbols-outlined text-[20px]">delete</span>
                Hapus Transaksi
            </button>
</section>
</main>
<style>
        /* Simple load animation for a smoother feel */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</body></html>
